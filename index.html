<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高雄・屏東 親子公園護照</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --cover:#1F3A2E;
    --cover-dark:#16281F;
    --paper:#FBF6EA;
    --paper-dim:#F1EAD8;
    --ink:#26332B;
    --ink-soft:#5B6A5F;
    --gold:#C9A227;
    --gold-deep:#9C7C17;
    --coral:#D4572A;
    --sky:#3E7CA6;
    --kh:#2F6B4F;
    --pt:#3E7CA6;
    --line: rgba(31,58,46,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cover);
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .stamp-font{ font-family:'Special Elite', monospace; letter-spacing:0.5px; }

  /* ---- Cover / header ---- */
  header.cover{
    padding:28px 20px 22px;
    color:var(--paper);
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--cover) 0%, var(--cover) 82%, var(--cover-dark) 100%);
    border-bottom:3px solid var(--gold);
  }
  .cover-inner{ max-width:720px; margin:0 auto; }
  .cover-eyebrow{
    display:flex; align-items:center; gap:8px;
    font-size:13px; color:var(--gold); margin-bottom:6px;
  }
  .cover-eyebrow .line{ flex:1; height:1px; background:rgba(201,162,39,0.4); }
  h1.title{
    font-size:26px; font-weight:900; margin:0 0 4px;
    letter-spacing:0.5px;
  }
  .subtitle{ font-size:13.5px; color:#CFE0D3; margin:0 0 16px; line-height:1.5; }
  .progress-row{ display:flex; align-items:center; gap:12px; }
  .progress-track{
    flex:1; height:10px; border-radius:6px; background:rgba(255,255,255,0.15);
    overflow:hidden; border:1px solid rgba(255,255,255,0.25);
  }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--gold-deep), var(--gold)); transition:width .4s ease; }
  .progress-label{ font-size:13px; white-space:nowrap; font-weight:700; color:var(--gold); }

  .region-tabs{ display:flex; gap:8px; margin-top:16px; }
  .region-tabs button{
    flex:1; padding:11px 8px; border-radius:12px; font-family:inherit;
    font-size:14.5px; font-weight:900; cursor:pointer;
    background:rgba(255,255,255,0.08); color:var(--paper);
    border:2px solid rgba(255,255,255,0.2); transition:background .15s, border-color .15s, transform .1s;
  }
  .region-tabs button:active{ transform:scale(0.97); }
  .region-tabs button.active.all{ background:var(--gold); color:var(--cover-dark); border-color:var(--gold-deep); }
  .region-tabs button.active.kh{ background:var(--kh); color:#fff; border-color:#173D2C; }
  .region-tabs button.active.pt{ background:var(--pt); color:#fff; border-color:#2A5D7A; }

  /* ---- Controls ---- */
  .controls{ max-width:720px; margin:16px auto 0; padding:0 20px 14px; }
  .search-box{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-size:15px; font-family:inherit; background:var(--paper); color:var(--ink);
    margin-bottom:10px;
  }
  .search-box:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .chip{
    padding:7px 13px; border-radius:20px; border:1.5px solid rgba(255,255,255,0.35);
    background:rgba(255,255,255,0.08); color:var(--paper); font-size:13px; cursor:pointer;
    font-family:inherit; transition:background .15s, color .15s, border-color .15s;
  }
  .chip.active{ background:var(--gold); border-color:var(--gold); color:var(--cover-dark); font-weight:700; }
  .sort-row{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .sort-row select{
    font-family:inherit; font-size:13px; padding:6px 10px; border-radius:8px;
    border:1.5px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.08); color:var(--paper);
  }
  .count-label{ font-size:13px; color:#CFE0D3; }

  /* ---- Main / cards ---- */
  main{ max-width:720px; margin:0 auto; padding:18px 20px 60px; background:var(--paper); border-radius:18px 18px 0 0; }
  .card{
    position:relative;
    background:#fff;
    border:1.5px dashed var(--line);
    border-radius:14px;
    padding:0 16px 14px;
    margin-bottom:16px;
    overflow:hidden;
  }
  .card-banner{ margin:0 -16px 12px; height:100px; }
  .card-banner.has-photo{ height:170px; }
  .card-banner-photo{ width:100%; height:100%; object-fit:cover; display:block; }
  .banner-svg{ width:100%; height:100%; display:block; }
  .card.visited{ background:#FFFDF6; border-style:solid; border-color:var(--gold); }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .section-header{
    display:flex; align-items:baseline; gap:10px; margin:26px 0 12px;
  }
  .section-header:first-child{ margin-top:4px; }
  .section-header h2{
    font-size:20px; font-weight:900; margin:0; color:var(--ink);
  }
  .section-header .section-badge{
    font-size:12px; font-weight:700; color:#fff; padding:3px 10px; border-radius:20px;
  }
  .section-badge.kh{ background:var(--kh); }
  .section-badge.pt{ background:var(--pt); }
  .section-header .section-count{ font-size:12.5px; color:var(--ink-soft); }
  .section-line{ flex:1; height:1px; background:var(--line); }
  .city-stamp{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
    padding:3px 9px; border-radius:20px; color:#fff; white-space:nowrap;
  }
  .city-stamp.kh{ background:var(--kh); }
  .city-stamp.pt{ background:var(--pt); }
  .park-name{ font-size:18px; font-weight:900; margin:8px 0 2px; line-height:1.3; }
  .park-district{ font-size:12.5px; color:var(--ink-soft); margin-bottom:8px; }
  .rating-row{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); margin-bottom:8px; }
  .stars{ color:var(--gold-deep); font-size:13px; }
  .tag-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .tag{ font-size:11.5px; padding:3px 9px; border-radius:6px; background:var(--paper-dim); color:var(--ink-soft); border:1px solid var(--line); }
  .desc{ font-size:14px; line-height:1.65; color:var(--ink); margin:0 0 10px; }
  .addr-row{ font-size:12.5px; color:var(--ink-soft); margin-bottom:12px; display:flex; gap:6px; }
  .addr-row a{ color:var(--sky); text-decoration:none; font-weight:700; }
  .card-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .btn{
    font-family:inherit; font-size:13.5px; font-weight:700; padding:9px 14px; border-radius:9px;
    border:1.5px solid var(--ink); background:#fff; color:var(--ink); cursor:pointer;
  }
  .btn.visited-on{ background:var(--gold); border-color:var(--gold-deep); color:var(--cover-dark); }
  .btn.ghost{ border-color:var(--line); color:var(--ink-soft); font-weight:500; }
  .stamp-mark{
    position:absolute; top:12px; right:14px; transform:rotate(-9deg);
    border:2.5px solid var(--coral); color:var(--coral);
    padding:2px 9px; border-radius:6px; font-size:12px; opacity:0.9;
  }

  .photo-section{ margin:2px 0 12px; }
  .photo-strip{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; }
  .photo-empty{ font-size:12.5px; color:var(--ink-soft); align-self:center; white-space:nowrap; }
  .photo-thumb-wrap{ position:relative; flex-shrink:0; }
  .photo-thumb{ width:78px; height:78px; object-fit:cover; border-radius:10px; border:1.5px solid var(--line); display:block; }
  .photo-remove{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
    background:var(--coral); color:#fff; border:2px solid #fff; font-size:13px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .photo-upload-label{ display:inline-flex; align-items:center; gap:6px; cursor:pointer; }

  /* comments */
  .comments{ margin-top:12px; border-top:1px dashed var(--line); padding-top:10px; }
  .comments.hidden{ display:none; }
  .comment{ font-size:13px; margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--paper-dim); }
  .comment:last-child{ border-bottom:none; }
  .comment-meta{ color:var(--ink-soft); font-size:11.5px; margin-top:2px; }
  .comment-form{ display:flex; gap:6px; margin-top:8px; }
  .comment-form input{
    flex:1; padding:8px 10px; border-radius:8px; border:1.5px solid var(--line);
    font-family:inherit; font-size:13px;
  }
  .comment-form button{
    padding:8px 12px; border-radius:8px; border:1.5px solid var(--ink); background:var(--ink);
    color:#fff; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;
  }
  .empty-state{ text-align:center; color:var(--ink-soft); padding:40px 10px; font-size:14px; }
  .notice{
    max-width:720px; margin:0 auto; padding:10px 20px; background:var(--paper-dim);
    color:var(--ink-soft); font-size:12px; text-align:center; line-height:1.6;
  }
  @media (max-width:420px){
    h1.title{ font-size:22px; }
  }
</style>
</head>
<body>

<header class="cover">
  <div class="cover-inner">
    <div class="cover-eyebrow"><span>小小探險家</span><span class="line"></span><span>PARK PASSPORT</span></div>
    <h1 class="title">高雄・屏東 親子公園護照</h1>
    <p class="subtitle">收集適合 1–12 歲小朋友的公園，蓋章記錄去過的地方，留言分享心得。</p>

      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-label" id="progressLabel">已蓋章 0 / 0</div>
    </div>
    <div class="region-tabs" id="regionTabs"></div>
  </div>
</header>

<div class="controls">
  <input class="search-box" id="searchBox" type="text" placeholder="搜尋公園名稱或地區…">
  <div class="chip-row" id="ageChips"></div>
  <div class="chip-row" id="visitedChips"></div>
  <div class="sort-row">
    <span class="count-label" id="countLabel"></span>
    <select id="sortSelect">
      <option value="rating">評分高到低</option>
      <option value="name">名稱排序</option>
      <option value="visited">未去過優先</option>

  </div>
</div>

<main id="cardList"></main>

    planet: '<circle cx="30" cy="30" r="10"/><ellipse cx="30" cy="30" rx="18" ry="6" fill="none" stroke-width="3"/>',

    animal: '<circle cx="32" cy="32" r="13"/><circle cx="22" cy="18" r="5"/><circle cx="42" cy="18" r="5"/>',
    chair: '<path d="M20 44 L20 26 Q20 16 32 16 Q44 16 44 26 L44 44"/><rect x="16" y="44" width="32" height="5" rx="2"/>',
    onion: '<path d="M32 12 C46 20 46 34 32 46 C18 34 18 20 32 12 Z"/><rect x="30" y="6" width="4" height="8"/>',
    jellyfish: '<path d="M32 12 a16 16 0 0 1 16 16 c0 3 -2 5 -5 5 H21 c-3 0 -5 -2 -5 -5 a16 16 0 0 1 16 -16 Z"/><path d="M22 33 q2 8 -1 15 M32 33 q1 9 -2 15 M42 33 q-2 8 1 15" fill="none" stroke-width="3.5" stroke-linecap="round"/>',
    alien: '<ellipse cx="32" cy="30" rx="14" ry="16"/><circle cx="26" cy="28" r="4" fill="var(--cover)"/><circle cx="38" cy="28" r="4" fill="var(--cover)"/><path d="M24 14 L20 6 M40 14 L44 6" fill="none" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="6" r="2"/><circle cx="44" cy="6" r="2"/>',
    tube: '<rect x="14" y="24" width="36" height="16" rx="8"/><ellipse cx="14" cy="32" rx="6" ry="8" fill="var(--cover)"/><ellipse cx="50" cy="32" rx="6" ry="8" fill="var(--cover)"/>'
  };
  return glyphs[key] || glyphs.tree;
}
function cardBanner(p){
  const ground = p.city==='高雄' ? 'var(--kh)' : 'var(--pt)';
  const skyTop = p.city==='高雄' ? '#DCEFE2' : '#DCE9F3';
  const skyBottom = p.city==='高雄' ? '#F6FBF3' : '#F2F8FB';
  const gid = 'sky-'+p.id;
  return `<svg class="banner-svg" viewBox="0 0 400 130" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${skyTop}"/><stop offset="1" stop-color="${skyBottom}"/>
    </linearGradient></defs>
    <rect x="0" y="0" width="400" height="130" fill="url(#${gid})"/>
    <circle cx="352" cy="28" r="15" fill="var(--gold)" opacity="0.9"/>
    <path d="M0 92 Q100 68 210 90 T400 84 V130 H0 Z" fill="${ground}" opacity="0.22"/>
    <path d="M0 112 Q130 82 230 106 T400 96 V130 H0 Z" fill="${ground}"/>
    <g transform="translate(148,42) scale(1.7)" fill="var(--paper)" stroke="var(--paper)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${iconGlyph(p.icon)}</g>
  </svg>`;
}

const CITY_OPTIONS = ["全部","高雄","屏東"];
const AGE_OPTIONS = ["全部","幼幼","學齡前","國小"];
const VISITED_OPTIONS = ["全部","✅ 已去過","⬜ 未拜訪"];
let activeCity = "全部";
let activeAge = "全部";
let activeVisited = "全部";
let searchTerm = "";
let sortMode = "rating";
let stateCache = {}; // id -> {visited, comments, photos}

function mapsUrl(p){
  const query = encodeURIComponent(`${p.name} ${p.address}`);
  return `https://www.google.com/maps/search/?api=1&query=${query}&query_place_id=${p.placeId}`;
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise(resolve=>setTimeout(()=>resolve(null), ms))
  ]);
}

// Local, on-device storage (this version is for standalone hosting e.g. GitHub Pages —
// no Claude backend, so data stays in this browser only and is NOT shared with others).
async function loadState(){
  PARKS.forEach(p=>{ stateCache[p.id] = {visited:false, comments:[], photos:[]}; });
  try{
    const raw = window.localStorage.getItem('data:all');
    if(raw){
      const data = JSON.parse(raw);
      PARKS.forEach(p=>{
        if(data[p.id]){
          stateCache[p.id].visited = !!data[p.id].visited;
          stateCache[p.id].comments = data[p.id].comments || [];
          stateCache[p.id].photos = data[p.id].photos || [];
        }
      });
    }
  }catch(e){ console.error('data load failed', e); }
}

async function saveAll(){
  try{
    const data = {};
    PARKS.forEach(p=>{
      data[p.id] = {
        visited: stateCache[p.id].visited,
        comments: stateCache[p.id].comments,
        photos: stateCache[p.id].photos
      };
    });
    window.localStorage.setItem('data:all', JSON.stringify(data));
  }catch(e){ console.error('data save failed', e); }
}

function renderRegionTabs(){
  const wrap = document.getElementById('regionTabs');
  wrap.innerHTML = '';
  const defs = [
    {opt:'全部', cls:'all'},
    {opt:'高雄', cls:'kh'},
    {opt:'屏東', cls:'pt'}
  ];
  defs.forEach(d=>{
    const el = document.createElement('button');
    el.className = (d.opt===activeCity ? `active ${d.cls}` : '');
    el.textContent = d.opt;
    el.onclick = ()=>{ activeCity = d.opt; renderRegionTabs(); renderList(); };
    wrap.appendChild(el);
  });
}

function renderChips(){
  const ageWrap = document.getElementById('ageChips');
  ageWrap.innerHTML = '';
  AGE_OPTIONS.forEach(opt=>{
    const el = document.createElement('button');
    el.className = 'chip' + (opt===activeAge ? ' active':'');
    el.textContent = opt;
    el.onclick = ()=>{ activeAge = opt; renderChips(); renderList(); };
    ageWrap.appendChild(el);
  });

  const visitedWrap = document.getElementById('visitedChips');
  visitedWrap.innerHTML = '';
  VISITED_OPTIONS.forEach(opt=>{
    const el = document.createElement('button');
    el.className = 'chip' + (opt===activeVisited ? ' active':'');
    el.textContent = opt;
    el.onclick = ()=>{ activeVisited = opt; renderChips(); renderList(); };
    visitedWrap.appendChild(el);
  });
}

function filteredParks(){
  let list = PARKS.filter(p=>{
    if(activeCity!=='全部' && p.city!==activeCity) return false;
    if(activeAge!=='全部' && !p.age.includes(activeAge)) return false;
    const isVisited = !!stateCache[p.id]?.visited;
    if(activeVisited==='✅ 已去過' && !isVisited) return false;
    if(activeVisited==='⬜ 未拜訪' && isVisited) return false;
    if(searchTerm){
      const hay = (p.name+p.district+p.address).toLowerCase();
      if(!hay.includes(searchTerm.toLowerCase())) return false;
    }
    return true;
  });
  if(sortMode==='rating') list = list.sort((a,b)=>b.rating-a.rating);
  else if(sortMode==='name') list = list.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
  else if(sortMode==='visited') list = list.sort((a,b)=>{
    const av = stateCache[a.id]?.visited ? 1:0, bv = stateCache[b.id]?.visited ? 1:0;
    return av-bv;
  });
  return list;
}

function starString(rating){
  const full = Math.round(rating);
  return '★'.repeat(full) + '☆'.repeat(5-full);
}

function updateProgress(){
  const total = PARKS.length;
  const done = PARKS.filter(p=>stateCache[p.id]?.visited).length;
  document.getElementById('progressLabel').textContent = `已蓋章 ${done} / ${total}`;
  document.getElementById('progressFill').style.width = total? (done/total*100)+'%' : '0%';
}

function resizeImage(file, maxDim, quality){
  maxDim = maxDim || 560; quality = quality || 0.55;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('image load failed'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

function buildCard(p){
    const st = stateCache[p.id] || {visited:false, comments:[]};
    const card = document.createElement('div');
    card.className = 'card' + (st.visited ? ' visited' : '');

    const cityClass = p.city==='高雄' ? 'kh' : 'pt';
    const hasPhoto = st.photos && st.photos.length > 0;
    const bannerHtml = hasPhoto
      ? `<img class="card-banner-photo" src="${st.photos[0]}" alt="${escapeHtml(p.name)} 實拍照片">`
      : cardBanner(p);
    card.innerHTML = `
      ${st.visited ? '<div class="stamp-mark stamp-font">VISITED</div>' : ''}
      <div class="card-banner${hasPhoto ? ' has-photo' : ''}" data-role="card-banner">${bannerHtml}</div>
      <div class="card-top">
        <span class="city-stamp ${cityClass}">${p.city}・${p.district}</span>
      </div>
      <div class="park-name">${p.name}</div>
      <div class="rating-row"><span class="stars">${starString(p.rating)}</span><span>${p.rating.toFixed(1)}（${p.count} 則評論）</span></div>
      <div class="tag-row">
        ${p.age.map(a=>`<span class="tag">${a}</span>`).join('')}
        ${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}
      </div>
      <p class="desc">${p.desc}</p>
      <div class="addr-row"><span>📍 ${p.address}</span></div>
      <div class="addr-row"><a href="${mapsUrl(p)}" target="_blank" rel="noopener">在 Google 地圖開啟 →</a></div>
      <div class="photo-section">
        <div class="photo-strip" data-role="photo-strip"></div>
        <label class="btn ghost photo-upload-label">📷 上傳照片
          <input type="file" accept="image/*" data-role="photo-input" style="display:none">
        </label>
      </div>
      <div class="card-actions">
        <button class="btn ${st.visited?'visited-on':''}" data-action="toggle">${st.visited ? '✅ 已蓋章' : '⬜ 標記去過'}</button>
        <button class="btn ghost" data-action="comments">💬 留言（${st.comments.length}）</button>
      </div>
      <div class="comments hidden" data-role="comments">
        <div data-role="comment-list"></div>
        <div class="comment-form">
          <input type="text" placeholder="留下心得或提醒…" data-role="comment-input">
          <button data-action="add-comment">送出</button>
        </div>
      </div>
    `;

    card.querySelector('[data-action="toggle"]').addEventListener('click', async ()=>{
      st.visited = !st.visited;
      stateCache[p.id] = st;
      await saveAll();
      updateProgress();
      renderList();
    });

    const commentsEl = card.querySelector('[data-role="comments"]');
    card.querySelector('[data-action="comments"]').addEventListener('click', ()=>{
      commentsEl.classList.toggle('hidden');
    });

    function renderComments(){
      const listEl = commentsEl.querySelector('[data-role="comment-list"]');
      if(st.comments.length===0){
        listEl.innerHTML = '<div class="comment" style="color:var(--ink-soft)">還沒有留言，第一個分享心得吧！</div>';
      } else {
        listEl.innerHTML = st.comments.map(c=>`
          <div class="comment">${escapeHtml(c.text)}<div class="comment-meta">${new Date(c.date).toLocaleDateString('zh-TW')}</div></div>
        `).join('');
      }
    }
    renderComments();

    function renderBanner(){
      const bannerEl = card.querySelector('[data-role="card-banner"]');
      const photos = st.photos || [];
      if(photos.length > 0){
        bannerEl.classList.add('has-photo');
        bannerEl.innerHTML = `<img class="card-banner-photo" src="${photos[0]}" alt="${escapeHtml(p.name)} 實拍照片">`;
      } else {
        bannerEl.classList.remove('has-photo');
        bannerEl.innerHTML = cardBanner(p);
      }
    }

    function renderPhotos(){
      const strip = card.querySelector('[data-role="photo-strip"]');
      const photos = st.photos || [];
      renderBanner();
      if(photos.length===0){
        strip.innerHTML = '<span class="photo-empty">還沒有照片，點右邊上傳第一張吧！</span>';
        return;
      }
      strip.innerHTML = photos.map((src,i)=>`
        <div class="photo-thumb-wrap">
          <a href="${src}" target="_blank" rel="noopener"><img class="photo-thumb" src="${src}" alt="${escapeHtml(p.name)} 照片"></a>
          <button class="photo-remove" data-idx="${i}" title="刪除照片" type="button">×</button>
        </div>
      `).join('');
      strip.querySelectorAll('.photo-remove').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const idx = parseInt(btn.dataset.idx, 10);
          st.photos.splice(idx, 1);
          stateCache[p.id] = st;
          await saveAll();
          renderPhotos();
        });
      });
    }
    renderPhotos();

    card.querySelector('[data-role="photo-input"]').addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        const dataUrl = await resizeImage(file);
        st.photos = st.photos || [];
        st.photos.unshift(dataUrl);
        if(st.photos.length > 2) st.photos = st.photos.slice(0, 2);
        stateCache[p.id] = st;
        await saveAll();
        renderPhotos();
      }catch(err){
        console.error('photo upload failed', err);
        alert('這張照片上傳失敗，換一張試試看。');
      }
      e.target.value = '';
    });

    card.querySelector('[data-action="add-comment"]').addEventListener('click', async ()=>{
      const input = card.querySelector('[data-role="comment-input"]');
      const text = input.value.trim();
      if(!text) return;
      st.comments.push({text, date: new Date().toISOString()});
      stateCache[p.id] = st;
      await saveAll();
      input.value = '';
      renderComments();
      card.querySelector('[data-action="comments"]').textContent = `💬 留言（${st.comments.length}）`;
    });

    return card;
}

function renderList(){
  const list = filteredParks();
  document.getElementById('countLabel').textContent = `共 ${list.length} 座公園`;
  const container = document.getElementById('cardList');
  container.innerHTML = '';
  if(list.length===0){
    container.innerHTML = '<div class="empty-state">找不到符合條件的公園，試試看調整篩選條件。</div>';
    return;
  }
  const groups = [
    {city:'高雄', cls:'kh', items: list.filter(p=>p.city==='高雄')},
    {city:'屏東', cls:'pt', items: list.filter(p=>p.city==='屏東')}
  ];
  groups.forEach(g=>{
    if(g.items.length===0) return;
    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `<span class="section-badge ${g.cls}">${g.city}</span><h2>${g.city}的公園</h2><span class="section-line"></span><span class="section-count">${g.items.length} 座</span>`;
    container.appendChild(header);
    g.items.forEach(p=>{
      container.appendChild(buildCard(p));
    });
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('searchBox').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  renderList();
});
document.getElementById('sortSelect').addEventListener('change', (e)=>{
  sortMode = e.target.value;
  renderList();
});

(async function init(){
  try{
    renderRegionTabs();
    renderChips();
    document.getElementById('cardList').innerHTML = '<div class="empty-state">載入中…</div>';
    try{
      await loadState();
    }catch(e){
      console.error('init loadState failed, showing defaults', e);
      PARKS.forEach(p=>{ if(!stateCache[p.id]) stateCache[p.id] = {visited:false, comments:[], photos:[]}; });
    }
  }catch(e){
    console.error('init setup failed', e);
    PARKS.forEach(p=>{ if(!stateCache[p.id]) stateCache[p.id] = {visited:false, comments:[], photos:[]}; });
  }
  updateProgress();
  renderList();
})();
</script>
